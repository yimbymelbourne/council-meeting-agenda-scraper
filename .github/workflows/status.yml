# Regenerates docs/status.md after every merge to main.
#
# Deliberately runs only on main, never on pull requests. Coverage is derived
# from the fixtures, so any branch could regenerate it — but if every PR did,
# they would all conflict on the same file. Generating it once, after merge,
# means contributors never touch it and there is nothing to conflict over.
name: Update scraper status

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.4.1
          poetry install --with dev
      - name: Regenerate docs/status.md
        run: poetry run python scripts/scorecard.py --markdown > docs/status.md
      - name: Commit if it changed
        run: |
          if git diff --quiet docs/status.md; then
            echo "Status unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.md
          # [skip ci] so committing the status does not retrigger this workflow.
          git commit -m "Update scraper status [skip ci]"
          git push
